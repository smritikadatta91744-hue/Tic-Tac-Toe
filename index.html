<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- <div class="title">
        <h1 class="main">TIC <span>TAC</span> TOE</h1> -->
<div class="container">
    <h1 class="title">TIC <span>TAC</span> TOE</h1>
    <div class="score-board">
    <div class="score-box">
        <p id="X">X</p>
        <span id="x-score">0</span>
        </div>
    <div class="score-box">
        <p>DRAW</p>
        <span id="draw-score">0</span>
    </div>
    <div class="score-box">
        <p id="O">O</p>
        <span id="o-score">0</span>
    </div>
</div>
<p id="status">Player X Turn</p>

<div class="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
</div>
<button id="play-again" class="btn play-again">PLAY AGAIN</button>
<button id="reset" class="btn new-game">NEW GAME</button>
</div>

<script src="script.js"></script>
</body>
</html>
